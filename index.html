<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Орб и Древний Дракон</title>
<style>
:root{--bg:#efe9dc;--fg:#222;--bt:#3b2f63;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14121c;--fg:#eee;--bt:#5b4aa0}}
:root[data-theme="dark"]{--bg:#14121c;--fg:#eee;--bt:#5b4aa0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
canvas{width:min(100%,900px,calc((100vh - 96px)*5/3));aspect-ratio:5/3;background:#000;display:block}
#pad{display:flex;justify-content:space-between;width:100%;max-width:900px;padding:0 10px;box-sizing:border-box}
#pad div{display:flex;gap:10px}
button{width:68px;height:68px;border-radius:50%;border:2px solid var(--fg);background:var(--bt);color:#fff;font-size:26px}
button:active{filter:brightness(1.4)}
</style></head><body>
<canvas id="c" width="800" height="480"></canvas>
<div id="pad"><div><button id="bl">◀</button><button id="br">▶</button></div><div><button id="bs">⇄</button><button id="bj">▲</button></div></div>
<script>
const T=32,W=800,H=480,cv=document.getElementById('c'),g=cv.getContext('2d');
const K={};
const NAMES=["Опушка","Тропа","Мшистый мост","Шёпот леса","Корни древа","Кристальная пещера","Гулкие своды","Глубины","Подземное озеро","Врата тьмы","Чёрные башни","Стена пламени","Тронный путь","Лава и сталь","Логово дракона"];
const TH=[["#6fb7d9","#cfe9c8","#4a3a2a","#3f9a3f"],["#1b1530","#3a2a5c","#3a3550","#6b5aa8"],["#3a0f12","#a8441c","#2a2226","#c4452a"]];
let m,C,ents,P,boss,fb,L=0,st='title',msgT=0,dead=0,tk=0,keyHas=0,ptl=null,sparks=[];
let saved=0;try{saved=Math.min(14,+localStorage.getItem('orb_lvl')||0)}catch(e){}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function load(l){
  L=l;m=[];ents=[];fb=[];boss=null;ptl=null;keyHas=0;msgT=150;
  const r=rng(l*977+5);let top=11;
  const col=(t,f)=>{const a=Array(15).fill(0);if(t!=null)for(let y=t;y<15;y++)a[y]=1;if(f)f(a);m.push(a)};
  const flat=n=>{for(let i=0;i<n;i++)col(top)};
  if(l==14){
    for(let c=0;c<30;c++){if(c==0||c==29)col(0);else col(11,a=>{if((c>=6&&c<=9)||(c>=20&&c<=23))a[8]=1})}
    boss={x:21*T,y:11*T-64,w:64,h:64,hp:5,d:-1,inv:0,f:90};
  }else{
    flat(4);const n=5+l,kp=n>>1;
    for(let s=0;s<n;s++){
      if(s==kp){flat(1);const c0=m.length;for(let i=0;i<5;i++)col(top,a=>{if(i>=1&&i<=3)a[top-2]=1});
        ents.push({t:'k',x:(c0+2)*T+8,y:(top-3)*T+8,w:16,h:16});flat(1);continue}
      const o=['f','st','g','sp'];if(l>=1)o.push('sl');if(l>=2)o.push('w');
      const p=o[r()*o.length|0];
      if(p=='f')flat(2+(r()*3|0));
      else if(p=='st'){flat(1);top=Math.max(8,Math.min(12,top+(r()<.5?-1:1)));flat(2)}
      else if(p=='g'){flat(2);const w=l<3?1+(r()*2|0):(r()<.35?3:2);for(let i=0;i<w;i++)col(null);flat(2)}
      else if(p=='sp'){flat(2);const w=1+(r()<.4?1:0);for(let i=0;i<w;i++)col(top,a=>a[top-1]=3);flat(2)}
      else if(p=='sl'){const c0=m.length;flat(6);ents.push({t:'s',x:(c0+2)*T,y:top*T-20,w:28,h:20,x0:(c0+1)*T,x1:(c0+5)*T-28,d:1})}
      else{flat(2);col(top,a=>{for(let i=1;i<=4;i++)a[top-i]=2});flat(2)}
    }
    flat(2);col(top,a=>{for(let i=1;i<=4;i++)a[top-i]=6});flat(2);
    ptl={x:(m.length-1)*T-16,y:top*T-56,w:32,h:56};flat(4);
  }
  C=m.length;
  P={x:T*1.5,y:11*T-25,vx:0,vy:0,w:24,h:24,form:0,on:0,coy:0,jb:0,rot:0};
}
const tile=(c,r)=>c<0||c>=C?1:r<0||r>=15?0:m[c][r];
const solid=(c,r)=>{const v=tile(c,r);return v==1||v==2||v==6};
function die(){if(!dead){dead=45}}
function sw(){if(st=='play'&&!dead)P.form^=1}
function openGates(){for(const a of m)for(let i=0;i<15;i++)if(a[i]==6)a[i]=0}
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function moveX(dx){
  P.x+=dx;const c=Math.floor((dx>0?P.x+P.w-.01:P.x)/T),r0=Math.floor(P.y/T),r1=Math.floor((P.y+P.h-.01)/T);
  for(let r=r0;r<=r1;r++){
    if(!solid(c,r))continue;
    if(tile(c,r)==2&&P.form==0&&Math.abs(P.vx)>1.6){for(let i=0;i<15;i++)if(m[c][i]==2){m[c][i]=0;for(let k=0;k<6;k++)sparks.push({x:c*T+16,y:i*T+16,vx:Math.random()*4-2,vy:Math.random()*-4,l:30})}continue}
    P.x=dx>0?c*T-P.w:(c+1)*T;P.vx=0;break;
  }
}
function moveY(dy){
  P.y+=dy;const r=Math.floor((dy>0?P.y+P.h-.01:P.y)/T),c0=Math.floor(P.x/T),c1=Math.floor((P.x+P.w-.01)/T);
  for(let c=c0;c<=c1;c++){
    if(!solid(c,r))continue;
    if(dy>0){P.y=r*T-P.h;P.on=1}else P.y=(r+1)*T;
    P.vy=0;break;
  }
}
function update(){
  tk++;if(msgT>0)msgT--;
  sparks=sparks.filter(s=>(s.x+=s.vx,s.y+=s.vy,s.vy+=.2,--s.l>0));
  if(dead){if(--dead==0)load(L);return}
  const w=P.form==1,L_=K.ArrowLeft||K.KeyA||K.L,R_=K.ArrowRight||K.KeyD||K.R,J=K.Space||K.ArrowUp||K.KeyW||K.J;
  const spd=w?3.3:2.7,ax=P.on?.4:.25,tgt=(R_?1:0)-(L_?1:0);
  P.vx+=Math.max(-ax,Math.min(ax,tgt*spd-P.vx));if(!tgt&&P.on)P.vx*=.9;
  if(J)P.jb=6;else if(P.jb>0)P.jb--;
  if(P.on)P.coy=6;else if(P.coy>0)P.coy--;
  if(P.jb>0&&P.coy>0){P.vy=w?-8:-9;P.jb=0;P.coy=0;P.on=0}
  P.vy=Math.min(P.vy+(w?.3:.55),w?4:12);
  P.on=0;moveX(P.vx);moveY(P.vy);P.rot+=P.vx/12;
  if(P.y>H+40)die();
  for(let c=Math.floor(P.x/T);c<=Math.floor((P.x+P.w)/T);c++)for(let r=Math.floor(P.y/T);r<=Math.floor((P.y+P.h)/T);r++)
    if(tile(c,r)==3&&ov(P,{x:c*T+5,y:r*T+14,w:T-10,h:T-14}))die();
  for(const e of ents){
    if(e.t=='s'){e.x+=e.d*.6;if(e.x<e.x0||e.x>e.x1)e.d*=-1;
      if(!e.dead&&ov(P,e)){if(P.vy>1&&P.y+P.h<e.y+14){e.dead=1;P.vy=-7;P.on=0}else die()}}
    else if(e.t=='k'&&!e.dead&&ov(P,e)){e.dead=1;keyHas=1;openGates()}
  }
  ents=ents.filter(e=>!e.dead);
  if(boss){
    const b=boss,sp=1.1+(5-b.hp)*.25;b.x+=b.d*sp;if(b.x<3*T||b.x>27*T-64)b.d*=-1;if(b.inv>0)b.inv--;
    if(--b.f<=0){b.f=Math.max(55,100-(5-b.hp)*10);const d=P.x<b.x?-1:1;fb.push({x:b.x+(d<0?0:64),y:b.y+40,w:14,h:14,vx:d*3.2})}
    fb=fb.filter(f=>(f.x+=f.vx,f.x>0&&f.x<C*T));
    for(const f of fb)if(ov(P,f))die();
    if(ov(P,b)){
      if(P.vy>1&&P.y+P.h<b.y+30){
        if(P.form==0&&b.inv<=0){b.hp--;b.inv=70;for(let k=0;k<14;k++)sparks.push({x:b.x+32,y:b.y,vx:Math.random()*6-3,vy:Math.random()*-5,l:40});
          if(b.hp<=0){boss=null;fb=[];ptl={x:15*T,y:11*T-56,w:32,h:56}}}
        P.vy=-9;P.on=0;
      }else die();
    }
  }
  if(ptl&&ov(P,ptl)){
    if(L==14){st='win'}else{try{localStorage.setItem('orb_lvl',L+1)}catch(e){}load(L+1)}
  }
}
function draw(){
  const th=TH[Math.min(2,L/5|0)],cx=Math.max(0,Math.min(C*T-W,P.x-W/2+12));
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,th[0]);gr.addColorStop(1,th[1]);g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.fillStyle='rgba(0,0,0,.25)';
  for(let k=0;k<2;k++){g.beginPath();g.moveTo(0,H);for(let x=0;x<=W;x+=20)g.lineTo(x,330+k*40-Math.abs(Math.sin((x+cx*(.2+k*.2))/(90+k*60)))*(110-k*40));g.lineTo(W,H);g.fill()}
  g.fillStyle='#e0431a';g.fillRect(0,H-18,W,18);
  g.save();g.translate(-cx,0);
  const c0=Math.floor(cx/T),c1=Math.min(C-1,c0+27);
  for(let c=c0;c<=c1;c++)for(let r=0;r<15;r++){
    const v=m[c][r];if(!v)continue;const x=c*T,y=r*T;
    if(v==1){g.fillStyle=th[2];g.fillRect(x,y,T,T);if(!solid(c,r-1)){g.fillStyle=th[3];g.fillRect(x,y,T,6)}}
    else if(v==2){g.fillStyle='#8a7a68';g.fillRect(x,y,T,T);g.strokeStyle='#4a3e32';g.strokeRect(x+1,y+1,T-2,T-2);g.beginPath();g.moveTo(x+6,y+4);g.lineTo(x+16,y+16);g.lineTo(x+10,y+28);g.stroke()}
    else if(v==3){g.fillStyle='#cfd6df';g.beginPath();g.moveTo(x+3,y+T);g.lineTo(x+T/2,y+10);g.lineTo(x+T-3,y+T);g.fill()}
    else if(v==6){g.fillStyle='#d4a017';for(let i=0;i<4;i++)g.fillRect(x+4+i*8,y,4,T);g.fillRect(x,y+14,T,4)}
  }
  for(const e of ents){
    if(e.t=='s'){g.fillStyle='#4cc04c';g.beginPath();g.ellipse(e.x+14,e.y+12,15,10,0,0,7);g.fill();g.fillStyle='#fff';g.fillRect(e.x+7,e.y+6,5,5);g.fillRect(e.x+17,e.y+6,5,5)}
    else if(e.t=='k'){g.fillStyle='#ffd23f';g.beginPath();g.arc(e.x+8,e.y+8+Math.sin(tk/10)*3,8,0,7);g.fill();g.fillRect(e.x+7,e.y+14,3,8)}
  }
  if(ptl){g.save();g.translate(ptl.x+16,ptl.y+28);g.fillStyle='#b05cff';g.globalAlpha=.8;g.beginPath();g.ellipse(0,0,16+Math.sin(tk/8)*3,28,0,0,7);g.fill();g.fillStyle='#fff';g.globalAlpha=.6;g.beginPath();g.ellipse(0,0,8,18,0,0,7);g.fill();g.restore()}
  if(boss){const b=boss;if(!(b.inv>0&&tk%6<3)){g.fillStyle='#b3261e';g.fillRect(b.x,b.y+14,64,50);g.beginPath();const d=b.d;g.moveTo(b.x+32-d*32,b.y+6);g.lineTo(b.x+32-d*60,b.y+30);g.lineTo(b.x+32-d*32,b.y+36);g.fill();
    g.fillStyle='#6a1410';g.beginPath();g.moveTo(b.x+8,b.y+14);g.lineTo(b.x+32,b.y-14);g.lineTo(b.x+56,b.y+14);g.fill();g.fillStyle='#ffd23f';g.fillRect(b.x+32-d*40,b.y+16,6,6)}}
  g.fillStyle='#ff7a1a';for(const f of fb){g.beginPath();g.arc(f.x+7,f.y+7,8,0,7);g.fill()}
  for(const s of sparks){g.fillStyle='#fff';g.fillRect(s.x,s.y,3,3)}
  if(!dead||tk%4<2){
    g.save();g.translate(P.x+12,P.y+12);g.rotate(P.rot);
    if(P.form==0){const rg=g.createRadialGradient(-4,-4,2,0,0,13);rg.addColorStop(0,'#b8bcc6');rg.addColorStop(1,'#4b505c');g.fillStyle=rg;g.beginPath();g.arc(0,0,13,0,7);g.fill();g.fillStyle='#ffd23f';g.font='bold 14px serif';g.textAlign='center';g.fillText('ᛉ',0,5)}
    else{g.shadowColor='#7fd8ff';g.shadowBlur=16;g.fillStyle='rgba(170,230,255,.85)';g.beginPath();g.arc(0,0,12,0,7);g.fill();g.fillStyle='#fff';g.fillRect(-5,-3,3,5);g.fillRect(3,-3,3,5)}
    g.restore();
  }
  g.restore();
  g.fillStyle='rgba(0,0,0,.45)';g.fillRect(0,0,W,30);g.fillStyle='#fff';g.font='15px Georgia,serif';g.textAlign='left';
  g.fillText('Уровень '+(L+1)+'/15 · '+(P.form?'Дух: прыгает дальше, парит':'Камень: ломает стены, давит врагов')+(keyHas?' · 🗝':''),10,20);
  if(boss){g.fillStyle='#600';g.fillRect(W-170,8,150,14);g.fillStyle='#e33';g.fillRect(W-170,8,30*boss.hp,14)}
  g.textAlign='center';
  if(msgT>0&&st=='play'){g.font='28px Georgia,serif';g.fillStyle='rgba(255,255,255,'+Math.min(1,msgT/40)+')';g.fillText(NAMES[L],W/2,120);
    if(L==0){g.font='16px Georgia,serif';g.fillText('Q / ⇄ — сменить форму. Пройди через портал, взяв ключ 🗝',W/2,150)}
    if(L==14){g.font='16px Georgia,serif';g.fillText('Спрыгни на дракона сверху в форме Камня 5 раз!',W/2,150)}}
}
function screen(t1,t2){
  g.fillStyle='#120d22';g.fillRect(0,0,W,H);g.fillStyle='#e8d9ff';g.textAlign='center';
  g.font='bold 40px Georgia,serif';g.fillText(t1,W/2,170);g.font='18px Georgia,serif';
  t2.forEach((s,i)=>g.fillText(s,W/2,230+i*28));
}
function frame(){
  if(st=='play'){update();draw()}
  else if(st=='title')screen('Орб и Древний Дракон',['15 уровней · 2 формы · босс в конце','Коснись экрана или нажми любую клавишу','Продолжить с уровня '+(saved+1)]);
  else screen('Победа!',['Дракон повержен, королевство спасено','Нажми, чтобы начать заново']);
  requestAnimationFrame(frame);
}
function start(){
  if(st=='title'){load(saved);st='play'}
  else if(st=='win'){saved=0;try{localStorage.setItem('orb_lvl',0)}catch(e){}load(0);st='play'}
}
addEventListener('keydown',e=>{K[e.code]=1;if(e.code=='KeyQ'||e.code=='ShiftLeft'||e.code=='KeyE')sw();if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();start()});
addEventListener('keyup',e=>K[e.code]=0);
cv.addEventListener('pointerdown',start);
function bind(id,k){const e=document.getElementById(id);const on=v=>ev=>{ev.preventDefault();start();if(k=='S'){if(v)sw()}else K[k]=v};
  e.onpointerdown=on(1);e.onpointerup=e.onpointerleave=e.onpointercancel=on(0)}
bind('bl','L');bind('br','R');bind('bj','J');bind('bs','S');
load(0);let acc=0,last=performance.now();
(function loop(){requestAnimationFrame(loop)});
const _f=frame;frame=function(){const n=performance.now();acc+=Math.min(100,n-last);last=n;
  if(st=='play'){while(acc>=16.67){update();acc-=16.67}draw()}
  else{acc=0;if(st=='title')screen('Орб и Древний Дракон',['15 уровней · 2 формы · босс в конце','Коснись экрана или нажми любую клавишу','Продолжить с уровня '+(saved+1)]);
    else screen('Победа!',['Дракон повержен, королевство спасено','Нажми, чтобы начать заново'])}
  requestAnimationFrame(frame)};
frame();
</script></body></html>
